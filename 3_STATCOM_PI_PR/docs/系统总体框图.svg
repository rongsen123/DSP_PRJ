    <style>
      .title{font:700 34px 'Microsoft YaHei',sans-serif;fill:#0f172a}.h{font:700 22px 'Microsoft YaHei',sans-serif;fill:#0f172a}.t{font:18px 'Microsoft YaHei',sans-serif;fill:#1e293b}.s{font:15px 'Microsoft YaHei',sans-serif;fill:#475569}.box{stroke:#334155;stroke-width:2;rx:14}.confirmed{fill:#e8f5e9}.planned{fill:#fff8e1}.unknown{fill:#ffebee}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#b45309;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
